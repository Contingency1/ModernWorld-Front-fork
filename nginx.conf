events {
    worker_connections 1024;
}

http{
 server {
    listen 80;

    server_name testmodernworld.shop www.testmodernworld.shop;

    location /.well-known/acme-challenge/ {
    	allow all;
        root /var/www/certbot;
    }
    location / {
            return 301 https://$host$request_uri;  # 모든 HTTP 요청을 HTTPS로 리디렉트
        }
}

 server {
        listen 443 ssl;
        server_name testmodernworld.shop www.testmodernworld.shop; # 도메인 이름 ex:) eomjunsick.com

        ssl_certificate /etc/letsencrypt/live/testmodernworld.shop/fullchain.pem; # SSL 인증서 경로
        ssl_certificate_key /etc/letsencrypt/live/testmodernworld.shop/privkey.pem; # 개인 키 파일 경로

        access_log /var/log/nginx/access.log; # 로그 파일 경로
        error_log /var/log/nginx/error.log; # 에러 로그 파일 경로

        location / {
            proxy_pass http://front:3000; # http://[container_name]:[port]

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
}
}